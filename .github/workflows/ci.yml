name: CI
on: [push, pull_request]        # when to run
jobs:
  test:
    runs-on: ubuntu-latest      # the temporary machine
    steps:
      - uses: actions/checkout@v4          # copy your repo onto it
      - uses: actions/setup-python@v5      # install Python
        with:
          python-version: "3.12"           # matches your venv
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
